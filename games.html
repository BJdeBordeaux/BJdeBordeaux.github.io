<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小游戏 · 梁飞飞</title>
  <meta name="description" content="梁飞飞做的小游戏，来玩。">
  <meta name="theme-color" content="#9ab5a0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

  <header>
    <div class="container">
      <div class="header-nav">
        <a href="index.html" class="site-title">梁飞飞<span>·</span>小游戏</a>
        <a href="index.html" class="nav-about">← 回主页</a>
        <div class="nav-menu-wrap">
          <button class="nav-menu-btn" id="navMenuBtn" title="更多" aria-label="更多">···</button>
          <div class="nav-dropdown" id="navDropdown">
            <a href="games.html" class="nav-dropdown-item">🎮 小游戏</a>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggle" title="切换深色模式" aria-label="切换深色模式">🌙</button>
      </div>
      <p class="tagline">一些花里胡哨的东西</p>
    </div>
  </header>

  <div class="divider"></div>

  <main class="container games-page">

    <!-- Game selector -->
    <div class="game-selector" id="gameSelector">
      <h1 class="games-title">选个游戏</h1>
      <div class="game-list">
        <button class="game-btn" data-game="花里胡哨答题">
          <span class="game-btn-icon">✨</span>
          花里胡哨答题
        </button>
        <button class="game-btn" data-game="禅修地图">
          <span class="game-btn-icon">🧘</span>
          禅修地图
        </button>
      </div>
      <p class="games-more">更多游戏，待续……</p>
    </div>

    <!-- Game area: 花里胡哨答题 game area -->
    <div class="game-area" id="qaArea">
      <div class="game-header">
        <button class="game-back" id="qaBack">← 换一个游戏</button>
        <h2 class="game-name" id="qaName"></h2>
      </div>
      <p class="game-desc" id="qaDesc"></p>
      <div class="q-progress" id="qaProgress"></div>
      <div class="questions-wrap" id="qaWrap"></div>
    </div>

    <!-- Game area: 禅修地图 entry (level select) -->
    <div class="game-area" id="zmEntry" style="display:none">
      <div class="gc-back-bar">
        <button class="game-back" id="zmBackEntry">← 换一个游戏</button>
        <h2 class="gc-level-title">禅修地图</h2>
      </div>
      <p class="gc-entry-desc">每一关都是一段修行的入口。</p>
      <div class="gc-levels" id="zmLevels"></div>
    </div>

    <!-- Game area: 禅修地图 Level 1 — 感受世界 -->
    <div class="game-area" id="zmLevel1" style="display:none">
      <div class="gc-back-bar">
        <button class="game-back" id="zmBackL1">← 回到地图</button>
        <h2 class="gc-level-title">感受世界</h2>
      </div>
      <p class="gc-l1-desc" id="zmL1Desc">选好你要感受的感官（可多选），然后点「开始感受」。</p>

      <div class="gc-sense-grid" id="zmL1Grid"></div>

      <div class="gc-l1-ready" id="zmL1Ready" style="display:none">
        <button class="gc-ready-btn" id="zmL1Go">开始感受 →</button>
      </div>

      <!-- Practicing state -->
      <div class="sg-current" id="zmL1Timer" style="display:none">
        <div class="sg-current-label">正在感受</div>
        <div class="sg-current-sense" id="zmL1TimerText"></div>
        <div class="sg-timer-bar-wrap">
          <div class="sg-timer-bar-fill" id="zmL1TimerFill"></div>
        </div>
        <div class="sg-timer-text" id="zmL1TimerCount">15s</div>
        <div class="sg-controls">
          <button class="sg-skip-btn" id="zmL1SkipBtn">跳过剩余时间</button>
        </div>
      </div>
    </div>

    <!-- Level complete modal (reused by both) -->
    <div class="gc-modal" id="gcModal" style="display:none">
      <div class="gc-modal-bg" id="gcModalBg"></div>
      <div class="gc-modal-box">
        <div class="sg-complete-icon">🧘</div>
        <div class="sg-complete-title" id="gcModalTitle">感受世界 · 完成</div>
        <p class="gc-modal-desc">修行不是一次性搞懂什么，是每天回来一下。</p>
        <div class="gc-modal-collected" id="gcModalCollected"></div>
        <button class="sg-restart-btn" id="gcModalBtn">回到地图</button>
      </div>
    </div>

  </main>

  <footer>
    <div class="container">
      © 2026 梁飞飞 · 答案不重要，思考才重要
    </div>
  </footer>

  <script>
    (function () {
      /* ════════════════════════════════════
         公共：深色模式 & 导航三点菜单
         ════════════════════════════════════ */
      var btn = document.getElementById('themeToggle');
      if (btn) {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark');
          btn.textContent = '☀️';
        }
        btn.addEventListener('click', function () {
          var isDark = document.body.classList.toggle('dark');
          btn.textContent = isDark ? '☀️' : '🌙';
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
      }

      (function () {
        var menuBtn = document.getElementById('navMenuBtn');
        var menuDropdown = document.getElementById('navDropdown');
        if (!menuBtn || !menuDropdown) return;
        menuBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          menuDropdown.classList.toggle('open');
        });
        document.addEventListener('click', function () {
          menuDropdown.classList.remove('open');
        });
        menuDropdown.addEventListener('click', function (e) {
          e.stopPropagation();
        });
      })();

      /* ════════════════════════════════════
         模块 1：「花里胡哨答题」
         ════════════════════════════════════ */
      var qaState = {
        currentGame: null,
        cards: [],
        currentIndex: 0,
        total: 0
      };

      var qaArea = document.getElementById('qaArea');
      var qaName = document.getElementById('qaName');
      var qaDesc = document.getElementById('qaDesc');
      var qaWrap = document.getElementById('qaWrap');
      var qaProgress = document.getElementById('qaProgress');
      var qaBack = document.getElementById('qaBack');

      function qaLoadGame(gameName) {
        qaState.currentGame = gameName;
        showArea('qa');
        var url = 'games/' + encodeURIComponent(gameName) + '.json';
        fetch(url + '?t=' + Date.now())
          .then(function (r) { if (!r.ok) throw new Error('加载失败'); return r.json(); })
          .then(function (data) { qaRender(data); })
          .catch(function (err) {
            qaWrap.innerHTML = '<p class="game-error">加载失败：' + err.message + '</p>';
          });
      }

      function qaRender(data) {
        qaName.textContent = data.game;
        qaDesc.textContent = data.desc || '';
        qaWrap.innerHTML = '';
        qaState.cards = [];
        qaState.currentIndex = 0;
        qaState.total = data.questions.length;
        qaUpdateProgress();
        data.questions.forEach(function (q, index) {
          var card = qaBuildCard(q, index);
          if (index > 0) card.style.display = 'none';
          qaWrap.appendChild(card);
          qaState.cards.push(card);
        });
      }

      function qaBuildCard(q, index) {
        var card = document.createElement('div');
        card.className = 'question-card fade-up';
        card.id = 'card_' + index;

        var title = document.createElement('p');
        title.className = 'q-title';
        title.textContent = (index + 1) + '. ' + q.title;
        card.appendChild(title);

        if (q.image) {
          var iw = document.createElement('div');
          iw.className = 'q-img-wrap';
          var img = document.createElement('img');
          img.className = 'q-img';
          img.src = q.image;
          img.alt = '题目配图';
          img.loading = 'lazy';
          iw.appendChild(img);
          card.appendChild(iw);
        }

        var optDiv = document.createElement('div');
        optDiv.className = 'q-options';
        var selectedVal = '', inputVal = '';

        q.options.forEach(function (opt) {
          if (opt.type === 'radio') {
            var label = document.createElement('label');
            label.className = 'q-option';
            var radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'q_' + q.id;
            radio.value = opt.label;
            var span = document.createElement('span');
            span.textContent = opt.label;
            label.appendChild(radio);
            label.appendChild(span);
            optDiv.appendChild(label);
            radio.addEventListener('change', function () { selectedVal = opt.label; });
          } else if (opt.type === 'input') {
            var iw = document.createElement('div');
            iw.className = 'q-input-wrap';
            var inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'q-input';
            inp.placeholder = '输入你的答案…';
            iw.appendChild(inp);
            optDiv.appendChild(iw);
            inp.addEventListener('input', function () { inputVal = inp.value.trim(); });
          }
        });
        card.appendChild(optDiv);

        var submitBtn = document.createElement('button');
        submitBtn.className = 'q-submit';
        submitBtn.textContent = '提交答案';
        card.appendChild(submitBtn);

        var resultDiv = document.createElement('div');
        resultDiv.className = 'q-result';
        resultDiv.style.display = 'none';
        card.appendChild(resultDiv);

        var nextBtn = document.createElement('button');
        nextBtn.className = 'q-next-btn';
        nextBtn.style.display = 'none';
        var isLast = (index === data.questions.length - 1);
        if (isLast) {
          nextBtn.textContent = '完成 ✓';
          nextBtn.addEventListener('click', function () { qaGoBackSelector(); });
        } else {
          nextBtn.textContent = '下一题 →';
          nextBtn.addEventListener('click', function () { qaShowQ(index + 1); });
        }
        card.appendChild(nextBtn);

        submitBtn.addEventListener('click', function () {
          var answer = selectedVal || inputVal;
          if (!answer) {
            submitBtn.textContent = '选一个或写点啥再提交';
            submitBtn.classList.add('q-submit-warn');
            setTimeout(function () {
              submitBtn.textContent = '提交答案';
              submitBtn.classList.remove('q-submit-warn');
            }, 1800);
            return;
          }
          resultDiv.innerHTML =
            '<div class="q-result-col"><div class="q-result-label">你的答案</div><div class="q-result-box q-result-user">' + esc(answer) + '</div></div>' +
            '<div class="q-result-divider"></div>' +
            '<div class="q-result-col"><div class="q-result-label">梁飞飞的答案</div><div class="q-result-box q-result-mine">' + esc(q.myAnswer) + '</div></div>';
          resultDiv.style.display = 'flex';
          submitBtn.style.display = 'none';
          nextBtn.style.display = 'inline-block';
          card.querySelectorAll('input[type="radio"]').forEach(function (r) { r.disabled = true; });
          card.querySelectorAll('.q-input').forEach(function (r) { r.disabled = true; });
          qaSaveAnswer(q.id, answer);
        });

        return card;
      }

      function qaShowQ(index) {
        if (qaState.currentIndex >= 0 && qaState.currentIndex < qaState.cards.length)
          qaState.cards[qaState.currentIndex].style.display = 'none';
        qaState.currentIndex = index;
        var card = qaState.cards[index];
        card.style.display = '';
        card.classList.remove('fade-up');
        void card.offsetWidth;
        card.classList.add('fade-up');
        qaUpdateProgress();
      }

      function qaUpdateProgress() {
        if (!qaState.total) return;
        var html = '<div class="q-progress-dots">';
        for (var i = 0; i < qaState.total; i++) {
          var cls = (i === qaState.currentIndex) ? 'q-dot active' : 'q-dot';
          if (i < qaState.currentIndex) cls += ' done';
          html += '<span class="' + cls + '" data-idx="' + i + '"></span>';
        }
        html += '</div><span class="q-progress-hint">点击圆点跳题</span>';
        qaProgress.innerHTML = html;
        qaProgress.querySelectorAll('.q-dot').forEach(function (d) {
          d.addEventListener('click', function () {
            var idx = parseInt(this.dataset.idx);
            if (!isNaN(idx)) qaShowQ(idx);
          });
        });
      }

      function qaGoBackSelector() {
        qaState.currentGame = null;
        showArea('selector');
        qaWrap.innerHTML = '';
        qaState.cards = [];
        qaState.currentIndex = 0;
      }

      function qaSaveAnswer(qid, answer) {
        var key = 'game_answers_' + qid;
        var stored = [];
        try { var raw = localStorage.getItem(key); if (raw) stored = JSON.parse(raw); } catch(e){}
        stored.push({ questionId: qid, answer: answer, ts: new Date().toISOString() });
        try { localStorage.setItem(key, JSON.stringify(stored)); } catch(e){}
      }

      function esc(s) {
        var d = document.createElement('div'); d.appendChild(document.createTextNode(s)); return d.innerHTML;
      }

      qaBack.addEventListener('click', function () { qaGoBackSelector(); });

      /* ════════════════════════════════════
         模块 2：「禅修地图」
         ════════════════════════════════════ */
      var zmState = {
        level: -1,        // -1=entry, 1=L1
        l1Collected: [],  // collected sense indices
        l1Timer: null
      };

      var SENSES = [
        { id: 'see',   emoji: '👀', name: '看', desc: '看看你眼前的东西，注意颜色、形状、光线' },
        { id: 'smell', emoji: '👃', name: '闻', desc: '闻一闻周围的气味，淡淡的也好' },
        { id: 'taste', emoji: '👅', name: '尝', desc: '感受口中的味道，或者喝一口水' },
        { id: 'touch', emoji: '✋', name: '触', desc: '感受身体的触感，衣服、温度、坐姿' },
        { id: 'hear',  emoji: '👂', name: '听', desc: '听听周围的声音，近的和远的' }
      ];

      var zmEntry = document.getElementById('zmEntry');
      var zmLevels = document.getElementById('zmLevels');
      var zmLevel1 = document.getElementById('zmLevel1');

      function zmShowEntry() {
        showArea('zmEntry');
        zmState.level = -1;
        var html =
          '<div class="gc-level-card done" data-level="1">' +
            '<div class="gc-level-emoji">🌍</div>' +
            '<div class="gc-level-name">感受世界</div>' +
            '<div class="gc-level-done">未完成</div>' +
          '</div>' +
          '<div class="gc-level-card locked" data-level="2">' +
            '<div class="gc-level-emoji">?</div>' +
            '<div class="gc-level-name">未解锁</div>' +
            '<div class="gc-level-done">——</div>' +
          '</div>';
        zmLevels.innerHTML = html;
        zmLevels.querySelectorAll('.gc-level-card[data-level="1"]').forEach(function (c) {
          c.addEventListener('click', function () { zmOpenL1(); });
        });
        // update "done" label if L1 all collected
        if (zmState.l1Collected.length >= 5) {
          zmLevels.querySelector('.gc-level-card[data-level="1"] .gc-level-done').textContent = '✓ 已完成';
        }
      }

      function zmOpenL1() {
        zmState.level = 1;
        zmState.l1Collected = [];
        showArea('zmLevel1');
        document.getElementById('zmL1Desc').textContent = '选好你要感受的感官（可多选），然后点「开始感受」。';
        document.getElementById('zmL1Ready').style.display = 'none';
        document.getElementById('zmL1Timer').style.display = 'none';

        var gridHtml = '';
        SENSES.forEach(function (s, i) {
          gridHtml +=
            '<div class="gc-sense-btn" data-idx="' + i + '">' +
              '<span class="gc-sense-emoji">' + s.emoji + '</span>' +
              '<span class="gc-sense-name">' + s.name + '</span>' +
              '<span class="gc-sense-check"></span>' +
            '</div>';
        });
        document.getElementById('zmL1Grid').innerHTML = gridHtml;

        document.querySelectorAll('.gc-sense-btn').forEach(function (el) {
          el.addEventListener('click', function () {
            el.classList.toggle('selected');
            zmUpdateL1Ready();
          });
        });
        zmUpdateL1Ready();
      }

      function zmGetL1Selected() {
        var sel = [];
        document.querySelectorAll('.gc-sense-btn.selected').forEach(function (el) {
          sel.push(parseInt(el.dataset.idx));
        });
        return sel;
      }

      function zmUpdateL1Ready() {
        var sel = zmGetL1Selected();
        document.getElementById('zmL1Ready').style.display = sel.length > 0 ? 'flex' : 'none';
      }

      document.getElementById('zmL1Go').addEventListener('click', function () {
        var sel = zmGetL1Selected();
        if (sel.length === 0) return;
        document.getElementById('zmL1Desc').textContent = '感受正在进行中…';
        document.getElementById('zmL1Grid').style.display = 'none';
        document.getElementById('zmL1Ready').style.display = 'none';
        document.getElementById('zmL1Timer').style.display = 'block';
        zmStartL1Practice(sel);
      });

      function zmStartL1Practice(indices) {
        var text = indices.map(function (i) { return SENSES[i].emoji + ' ' + SENSES[i].name; }).join(' ＋ ');
        document.getElementById('zmL1TimerText').textContent = text;
        document.getElementById('zmL1TimerFill').style.width = '100%';
        document.getElementById('zmL1TimerCount').textContent = '15s';

        if (zmState.l1Timer) { clearInterval(zmState.l1Timer); zmState.l1Timer = null; }

        var rem = 15;
        zmState.l1Timer = setInterval(function () {
          rem--;
          if (rem <= 0) {
            clearInterval(zmState.l1Timer);
            zmState.l1Timer = null;
            zmDoneL1Practice(indices);
          } else {
            document.getElementById('zmL1TimerFill').style.width = (rem / 15 * 100) + '%';
            document.getElementById('zmL1TimerCount').textContent = rem + 's';
          }
        }, 1000);
      }

      function zmDoneL1Practice(indices) {
        indices.forEach(function (idx) {
          if (zmState.l1Collected.indexOf(idx) === -1) zmState.l1Collected.push(idx);
        });
        try { navigator.vibrate(60); } catch(e) {}
        document.getElementById('zmL1TimerCount').textContent = '✓';
        setTimeout(function () { zmShowL1Modal(indices); }, 800);
      }

      function zmShowL1Modal() {
        var allDone = zmState.l1Collected.length >= 5;
        document.getElementById('gcModalTitle').textContent = allDone ? '感受世界 · 完成' : '感官收获';
        document.getElementById('gcModalBtn').textContent = allDone ? '回到地图' : '继续感受世界';

        var colHtml = '';
        zmState.l1Collected.forEach(function (idx) {
          var s = SENSES[idx];
          colHtml += '<div class="gc-collect-card">' + s.emoji + ' ' + s.name + '</div>';
        });
        document.getElementById('gcModalCollected').innerHTML = colHtml;

        document.getElementById('gcModal').style.display = 'block';
        document.getElementById('zmL1Timer').style.display = 'none';
      }

      document.getElementById('gcModalBtn').addEventListener('click', function () {
        document.getElementById('gcModal').style.display = 'none';
        var allDone = zmState.l1Collected.length >= 5;
        if (allDone) {
          zmShowEntry();
        } else {
          zmOpenL1Again();
        }
      });

      function zmOpenL1Again() {
        showArea('zmLevel1');
        document.getElementById('zmL1Desc').textContent = '继续感受还未收集的感官～';
        document.getElementById('zmL1Timer').style.display = 'none';
        document.getElementById('zmL1Ready').style.display = 'none';

        var gridHtml = '';
        SENSES.forEach(function (s, i) {
          var cls = 'gc-sense-btn';
          if (zmState.l1Collected.indexOf(i) !== -1) cls += ' done';
          gridHtml +=
            '<div class="' + cls + '" data-idx="' + i + '">' +
              '<span class="gc-sense-emoji">' + s.emoji + '</span>' +
              '<span class="gc-sense-name">' + s.name + '</span>' +
              '<span class="gc-sense-check">' + (zmState.l1Collected.indexOf(i) !== -1 ? '✓' : '') + '</span>' +
            '</div>';
        });
        document.getElementById('zmL1Grid').innerHTML = gridHtml;

        document.querySelectorAll('.gc-sense-btn:not(.done)').forEach(function (el) {
          el.addEventListener('click', function () {
            el.classList.toggle('selected');
            zmUpdateL1Ready();
          });
        });
        zmUpdateL1Ready();
      }

      document.getElementById('zmL1SkipBtn').addEventListener('click', function () {
        if (zmState.l1Timer) { clearInterval(zmState.l1Timer); zmState.l1Timer = null; }
        zmDoneL1Practice(zmGetL1Selected());
      });

      document.getElementById('zmBackL1').addEventListener('click', function () {
        if (zmState.l1Timer) { clearInterval(zmState.l1Timer); zmState.l1Timer = null; }
        zmShowEntry();
      });

      document.getElementById('zmBackEntry').addEventListener('click', function () {
        showArea('selector');
      });

      /* ════════════════════════════════════
         公共工具：显示指定区域
         ════════════════════════════════════ */
      function showArea(area) {
        document.getElementById('gameSelector').style.display = area === 'selector' ? 'block' : 'none';
        qaArea.style.display = area === 'qa' ? 'block' : 'none';
        zmEntry.style.display = area === 'zmEntry' ? 'block' : 'none';
        zmLevel1.style.display = area === 'zmLevel1' ? 'block' : 'none';
      }

      /* ════════════════════════════════════
         入口：游戏选择按钮
         ════════════════════════════════════ */
      var gameBtns = document.querySelectorAll('.game-btn');
      gameBtns.forEach(function (b) {
        b.addEventListener('click', function () {
          gameBtns.forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          var name = b.dataset.game;
          if (name === '禅修地图') {
            zmShowEntry();
          } else {
            qaLoadGame(name);
          }
        });
      });

      // 默认选中第一个按钮
      if (gameBtns.length > 0) gameBtns[0].classList.add('active');

    })();
  </script>

</body>
</html>
