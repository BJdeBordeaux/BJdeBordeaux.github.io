<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小游戏 · 梁飞飞</title>
  <meta name="description" content="梁飞飞做的小游戏，来玩。">
  <meta name="theme-color" content="#9ab5a0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

  <header>
    <div class="container">
      <div class="header-nav">
        <a href="index.html" class="site-title">梁飞飞<span>·</span>小游戏</a>
        <a href="index.html" class="nav-about">← 回主页</a>
        <div class="nav-menu-wrap">
          <button class="nav-menu-btn" id="navMenuBtn" title="更多" aria-label="更多">···</button>
          <div class="nav-dropdown" id="navDropdown">
            <a href="games.html" class="nav-dropdown-item">✨ 小游戏</a>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggle" title="切换深色模式" aria-label="切换深色模式">🌙</button>
      </div>
      <p class="tagline">一些花里胡哨的东西</p>
    </div>
  </header>

  <div class="divider"></div>

  <main class="container games-page">

    <!-- Game selector -->
    <div class="game-selector" id="gameSelector">
      <h1 class="games-title">选个游戏</h1>
      <div class="game-list">
        <button class="game-btn active" data-game="花里胡哨答题">
          <span class="game-btn-icon">✨</span>
          花里胡哨答题
        </button>
        <button class="game-btn" data-game="禅修地图">
          <span class="game-btn-icon">🧘</span>
          禅修地图
        </button>
      </div>
      <p class="games-more">更多游戏，待续……</p>
    </div>

    <!-- Game area -->
    <div class="game-area" id="gameArea">
      <!-- Header -->
      <div class="game-header">
        <button class="game-back" id="gameBack">← 换一个游戏</button>
        <h2 class="game-name" id="gameName"></h2>
      </div>
      <p class="game-desc" id="gameDesc"></p>

      <!-- Progress indicator -->
      <div class="q-progress" id="qProgress"></div>

      <!-- Questions container -->
      <div class="questions-wrap" id="questionsWrap"></div>
    </div>

  </main>

  <footer>
    <div class="container">
      © 2026 梁飞飞 · 答案不重要，思考才重要
    </div>
  </footer>

  <script>
    (function () {
      // ── 深色模式 ─────────────────────────────
      var btn = document.getElementById('themeToggle');
      if (btn) {
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark');
          btn.textContent = '☀️';
        }
        btn.addEventListener('click', function () {
          var isDark = document.body.classList.toggle('dark');
          btn.textContent = isDark ? '☀️' : '🌙';
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
      }

      // ── 状态 ─────────────────────────────────
      var currentGame = null;
      var questionCards = [];
      var currentIndex = 0;
      var totalQuestions = 0;

      // ── DOM 引用 ─────────────────────────────
      var selectorEl = document.getElementById('gameSelector');
      var gameAreaEl = document.getElementById('gameArea');
      var gameNameEl = document.getElementById('gameName');
      var gameDescEl = document.getElementById('gameDesc');
      var questionsWrap = document.getElementById('questionsWrap');
      var gameBack = document.getElementById('gameBack');
      var progressEl = document.getElementById('qProgress');

      // ── 加载游戏 ─────────────────────────────
      function loadGame(gameName) {
        currentGame = gameName;
        selectorEl.style.display = 'none';
        gameAreaEl.style.display = 'block';

        if (gameName === '禅修地图') {
          startZenMap();
          return;
        }

        var url = 'games/' + encodeURIComponent(gameName) + '.json';
        fetch(url + '?t=' + Date.now())
          .then(function (r) {
            if (!r.ok) throw new Error('加载失败');
            return r.json();
          })
          .then(function (data) {
            renderGame(data);
          })
          .catch(function (err) {
            questionsWrap.innerHTML = '<p class="game-error">加载失败：' + err.message + '</p>';
          });
      }

      // ── 渲染游戏（花里胡哨答题）─────────────────────────────
      function renderGame(data) {
        gameNameEl.textContent = data.game;
        gameDescEl.textContent = data.desc || '';
        questionsWrap.innerHTML = '';
        questionCards = [];
        currentIndex = 0;
        totalQuestions = data.questions.length;

        // 进度指示
        updateProgress();

        // 创建所有卡片，但只显示第一张
        data.questions.forEach(function (q, index) {
          var card = buildCard(q, index);
          if (index > 0) {
            card.style.display = 'none';
          }
          questionsWrap.appendChild(card);
          questionCards.push(card);
        });
      }

      // ── 构建单张卡片 ─────────────────────────
      function buildCard(q, index) {
        var card = document.createElement('div');
        card.className = 'question-card fade-up';
        card.id = 'card_' + index;

        // 题目文字
        var title = document.createElement('p');
        title.className = 'q-title';
        title.textContent = (index + 1) + '. ' + q.title;
        card.appendChild(title);

        // 图片
        if (q.image) {
          var imgWrap = document.createElement('div');
          imgWrap.className = 'q-img-wrap';
          var img = document.createElement('img');
          img.className = 'q-img';
          img.src = q.image;
          img.alt = '题目配图';
          img.loading = 'lazy';
          imgWrap.appendChild(img);
          card.appendChild(imgWrap);
        }

        // 选项
        var optionsDiv = document.createElement('div');
        optionsDiv.className = 'q-options';

        var selectedVal = '';
        var inputVal = '';

        q.options.forEach(function (opt) {
          if (opt.type === 'radio') {
            var label = document.createElement('label');
            label.className = 'q-option';

            var radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'q_' + q.id;
            radio.value = opt.label;

            var span = document.createElement('span');
            span.textContent = opt.label;

            label.appendChild(radio);
            label.appendChild(span);
            optionsDiv.appendChild(label);

            radio.addEventListener('change', function () {
              selectedVal = opt.label;
            });
          } else if (opt.type === 'input') {
            var inputWrap = document.createElement('div');
            inputWrap.className = 'q-input-wrap';
            var input = document.createElement('input');
            input.type = 'text';
            input.className = 'q-input';
            input.placeholder = '输入你的答案…';
            inputWrap.appendChild(input);
            optionsDiv.appendChild(inputWrap);

            input.addEventListener('input', function () {
              inputVal = input.value.trim();
            });
          }
        });

        card.appendChild(optionsDiv);

        // 提交按钮
        var submitBtn = document.createElement('button');
        submitBtn.className = 'q-submit';
        submitBtn.textContent = '提交答案';
        card.appendChild(submitBtn);

        // 结果区
        var resultDiv = document.createElement('div');
        resultDiv.className = 'q-result';
        resultDiv.style.display = 'none';
        card.appendChild(resultDiv);

        // "下一题" 按钮（提交后才出现）
        var nextBtn = document.createElement('button');
        nextBtn.className = 'q-next-btn';
        nextBtn.style.display = 'none';

        var isLast = (index === totalQuestions - 1);
        if (isLast) {
          nextBtn.textContent = '完成 ✓';
          nextBtn.addEventListener('click', function () {
            // 回到游戏选择
            goBackToSelector();
          });
        } else {
          nextBtn.textContent = '下一题 →';
          nextBtn.addEventListener('click', function () {
            showQuestion(index + 1);
          });
        }
        card.appendChild(nextBtn);

        // ── 提交逻辑 ─────────────────────────
        submitBtn.addEventListener('click', function () {
          var answer = selectedVal || inputVal;
          if (!answer) {
            submitBtn.textContent = '选一个或写点啥再提交';
            submitBtn.classList.add('q-submit-warn');
            setTimeout(function () {
              submitBtn.textContent = '提交答案';
              submitBtn.classList.remove('q-submit-warn');
            }, 1800);
            return;
          }

          // 显示结果
          var resultHtml = '';
          resultHtml += '<div class="q-result-col">';
          resultHtml += '  <div class="q-result-label">你的答案</div>';
          resultHtml += '  <div class="q-result-box q-result-user">' + escapeHtml(answer) + '</div>';
          resultHtml += '</div>';
          resultHtml += '<div class="q-result-divider"></div>';
          resultHtml += '<div class="q-result-col">';
          resultHtml += '  <div class="q-result-label">梁飞飞的答案</div>';
          resultHtml += '  <div class="q-result-box q-result-mine">' + escapeHtml(q.myAnswer) + '</div>';
          resultHtml += '</div>';

          resultDiv.innerHTML = resultHtml;
          resultDiv.style.display = 'flex';
          submitBtn.style.display = 'none';

          // 显示"下一题"按钮
          nextBtn.style.display = 'inline-block';

          // 禁用选项
          var radios = card.querySelectorAll('input[type="radio"]');
          for (var i = 0; i < radios.length; i++) {
            radios[i].disabled = true;
          }
          var inputs = card.querySelectorAll('.q-input');
          for (var i = 0; i < inputs.length; i++) {
            inputs[i].disabled = true;
          }

          // 记录答案
          saveAnswer(q.id, answer);
        });

        return card;
      }

      // ── 切换题目 ─────────────────────────────
      function showQuestion(index) {
        // 隐藏当前卡片
        if (currentIndex >= 0 && currentIndex < questionCards.length) {
          questionCards[currentIndex].style.display = 'none';
        }
        // 显示目标卡片
        currentIndex = index;
        var card = questionCards[currentIndex];
        card.style.display = '';
        // 重新触发动画
        card.classList.remove('fade-up');
        void card.offsetWidth; // 强制回流
        card.classList.add('fade-up');
        // 更新进度
        updateProgress();
      }

      // ── 进度指示 ─────────────────────────────
      function updateProgress() {
        if (!totalQuestions) return;
        var html = '<div class="q-progress-dots">';
        for (var i = 0; i < totalQuestions; i++) {
          var cls = (i === currentIndex) ? 'q-dot active' : 'q-dot';
          if (i < currentIndex) cls += ' done';
          html += '<span class="' + cls + '" data-index="' + i + '"></span>';
        }
        html += '</div>';
        html += '<span class="q-progress-hint">点击圆点跳题</span>';
        progressEl.innerHTML = html;

        // 绑定点击跳转
        var dots = progressEl.querySelectorAll('.q-dot');
        for (var j = 0; j < dots.length; j++) {
          dots[j].addEventListener('click', function (e) {
            var idx = parseInt(this.dataset.index);
            if (!isNaN(idx)) {
              showQuestion(idx);
            }
          });
        }
      }

      // ── 返回游戏选择 ─────────────────────────
      function goBackToSelector() {
        currentGame = null;
        gameAreaEl.style.display = 'none';
        selectorEl.style.display = 'block';
        questionsWrap.innerHTML = '';
        questionCards = [];
        currentIndex = 0;
      }

      // ── 记录答案（当前用 localStorage） ───────
      function saveAnswer(questionId, answer) {
        var payload = {
          questionId: questionId,
          answer: answer,
          timestamp: new Date().toISOString()
        };
        var key = 'game_answers_' + questionId;
        var stored = [];
        try {
          var raw = localStorage.getItem(key);
          if (raw) stored = JSON.parse(raw);
        } catch(e) {}
        stored.push(payload);
        try {
          localStorage.setItem(key, JSON.stringify(stored));
        } catch(e) {}
      }

      // ── HTML 转义 ───────────────────────────
      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      // ── 返回游戏选择（按钮） ─────────────────
      gameBack.addEventListener('click', function () {
        goBackToSelector();
      });

      // ── 选择游戏 ─────────────────────────────
      var gameBtns = document.querySelectorAll('.game-btn');
      gameBtns.forEach(function (b) {
        b.addEventListener('click', function () {
          gameBtns.forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');

          var name = b.dataset.game;
          loadGame(name);
        });
      });

      // ════════════════════════════════════════
      //  禅修地图
      // ════════════════════════════════════════

      var ZEN_LEVELS = [
        { id: 1, name: '感受世界', desc: '把注意力带到感官上，一个一个地感受它们', locked: false },
        { id: 2, name: '待解锁', desc: '完成第一关后解锁', locked: true }
      ];

      var SENSES = [
        { id: 'see',   emoji: '👁', name: '看',  desc: '看看你眼前的东西，注意颜色、形状、光线' },
        { id: 'smell', emoji: '👃', name: '闻',  desc: '闻一闻周围的气味，淡淡的也好' },
        { id: 'taste', emoji: '👅', name: '尝',  desc: '感受口中的味道，或者喝一口水' },
        { id: 'touch', emoji: '✋', name: '触',  desc: '感受身体的触感，衣服、温度、坐姿' },
        { id: 'hear',  emoji: '👂', name: '听',  desc: '听听周围的声音，近的和远的' }
      ];

      var TIMER_SEC = 15;
      var zmTimer = null;
      var zmRemaining = 0;
      var zmRunning = false;
      var zmCurrentSense = null;
      var zmCollectedCards = [];

      // ── 启动禅修地图 ─────────────────────────
      function startZenMap() {
        currentGame = '禅修地图';
        selectorEl.style.display = 'none';
        gameAreaEl.style.display = 'block';
        gameNameEl.textContent = '禅修地图';
        gameDescEl.textContent = '通过一些练习，让你对禅修修行有一些领悟。';
        questionsWrap.innerHTML = '';

        renderZenMapLevels();
      }

      // ── 渲染关卡选择 ─────────────────────────
      function renderZenMapLevels() {
        var html = '<div class="zm-levels">';
        html += '<h3 class="zm-levels-title">选择关卡</h3>';
        ZEN_LEVELS.forEach(function (lv) {
          var cls = 'zm-level' + (lv.locked ? ' locked' : '');
          html += '<button class="' + cls + '" data-level="' + lv.id + '" ' + (lv.locked ? 'disabled' : '') + '>';
          html += '  <span class="zm-level-icon">' + (lv.locked ? '🔒' : '🧘') + '</span>';
          html += '  <span class="zm-level-name">' + lv.name + '</span>';
          html += '  <span class="zm-level-desc">' + lv.desc + '</span>';
          html += '</button>';
        });
        html += '</div>';

        // 已收集卡片区域
        if (zmCollectedCards.length > 0) {
          html += '<div class="zm-collected-area">';
          html += '<h4 class="zm-collected-title">已收集卡片</h4>';
          html += '<div class="zm-collected-grid">';
          zmCollectedCards.forEach(function (combo) {
            var emojiStr = combo.map(function (idx) { return SENSES[idx].emoji; }).join(' ');
            var nameStr = combo.map(function (idx) { return SENSES[idx].name; }).join('+');
            html += '<div class="zm-collected-card">';
            html += '  <span class="zm-collected-card-emoji">' + emojiStr + '</span>';
            html += '  <span class="zm-collected-card-name">' + nameStr + '</span>';
            html += '</div>';
          });
          html += '</div>';
          html += '</div>';
        }

        questionsWrap.innerHTML = html;

        // 绑定关卡点击
        questionsWrap.querySelectorAll('.zm-level:not(.locked)').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var levelId = parseInt(this.dataset.level);
            if (levelId === 1) {
              startZenLevel1();
            }
          });
        });
      }

      // ── 开始第一关：感受世界 ─────────────────
      function startZenLevel1() {
        zmRunning = false;

        gameNameEl.textContent = '感受世界';
        gameDescEl.textContent = '选择你想感受的感官（可多选），然后开始练习。';

        renderSenseSelect();
      }

      // ── 渲染感官选择界面 ─────────────────────
      function renderSenseSelect() {
        var html = '<div class="zm-sense-select">';
        html += '<p class="zm-sense-select-hint">点击选择感官（可多选）</p>';
        html += '<div class="zm-senses-grid">';

        SENSES.forEach(function (s, i) {
          html += '<div class="zm-sense-item" data-index="' + i + '">';
          html += '  <span class="zm-sense-emoji">' + s.emoji + '</span>';
          html += '  <span class="zm-sense-name">' + s.name + '</span>';
          html += '  <span class="zm-sense-check">✓</span>';
          html += '</div>';
        });

        html += '</div>';
        html += '<button class="zm-start-btn" id="zmStartBtn" disabled>开始练习</button>';
        html += '<button class="zm-back-btn" id="zmBackBtn">返回选关</button>';
        html += '</div>';

        questionsWrap.innerHTML = html;

        // 绑定感官选择
        var selectedSenses = [];
        questionsWrap.querySelectorAll('.zm-sense-item').forEach(function (item) {
          item.addEventListener('click', function () {
            var idx = parseInt(this.dataset.index);
            var pos = selectedSenses.indexOf(idx);
            if (pos === -1) {
              selectedSenses.push(idx);
              this.classList.add('selected');
            } else {
              selectedSenses.splice(pos, 1);
              this.classList.remove('selected');
            }

            // 更新开始按钮状态
            document.getElementById('zmStartBtn').disabled = selectedSenses.length === 0;
          });
        });

        // 开始按钮
        document.getElementById('zmStartBtn').addEventListener('click', function () {
          if (selectedSenses.length > 0) {
            startSensePractice(selectedSenses);
          }
        });

        // 返回按钮
        document.getElementById('zmBackBtn').addEventListener('click', function () {
          renderZenMapLevels();
        });
      }

      // ── 开始感官练习 ─────────────────────────
      function startSensePractice(senseIndices) {
        zmRunning = true;
        zmRemaining = TIMER_SEC;

        var html = '<div class="zm-practice">';
        html += '<div class="zm-practice-header">';
        html += '  <div class="zm-practice-title">感受中…</div>';
        html += '  <div class="zm-practice-timer" id="zmTimer">' + TIMER_SEC + 's</div>';
        html += '</div>';
        html += '<div class="zm-timer-bar-wrap">';
        html += '  <div class="zm-timer-bar-fill" id="zmTimerFill"></div>';
        html += '</div>';
        html += '<div class="zm-current-senses" id="zmCurrentSenses">';

        senseIndices.forEach(function (idx) {
          var s = SENSES[idx];
          html += '<div class="zm-current-sense">' + s.emoji + ' ' + s.name + '</div>';
        });

        html += '</div>';
        html += '<div class="zm-practice-desc" id="zmPracticeDesc">把注意力带到这些感官上，静静感受…</div>';
        html += '<button class="zm-skip-btn" id="zmSkipBtn">跳过</button>';
        html += '</div>';

        questionsWrap.innerHTML = html;

        // 启动计时器
        zmTimer = setInterval(function () {
          zmRemaining--;
          if (zmRemaining <= 0) {
            clearInterval(zmTimer);
            zmTimer = null;
            completeSensePractice(senseIndices);
          } else {
            var pct = (zmRemaining / TIMER_SEC) * 100;
            document.getElementById('zmTimerFill').style.width = pct + '%';
            document.getElementById('zmTimer').textContent = zmRemaining + 's';
          }
        }, 1000);

        // 跳过按钮
        document.getElementById('zmSkipBtn').addEventListener('click', function () {
          if (zmRunning && zmTimer) {
            clearInterval(zmTimer);
            zmTimer = null;
            completeSensePractice(senseIndices);
          }
        });
      }

      // ── 完成感官练习 ─────────────────────────
      function completeSensePractice(senseIndices) {
        zmRunning = false;

        // 收集卡片（整个组合作为一张卡片）
        var already = zmCollectedCards.some(function (combo) {
          return combo.length === senseIndices.length && combo.every(function (v, i) { return v === senseIndices[i]; });
        });
        if (!already) {
          zmCollectedCards.push(senseIndices.slice()); // 复制数组
        }

        // 保存刚完成的组合（用于动画）
        var newCombo = senseIndices.slice();

        // 震动
        try { navigator.vibrate(50); } catch(e) {}

        // 显示完成界面
        var html = '<div class="zm-complete">';
        html += '<div class="zm-complete-icon">✨</div>';
        html += '<div class="zm-complete-title">感受完成</div>';
        html += '<div class="zm-complete-desc">你把注意力带回了身体，这就是修行的开始。</div>';
        html += '<div class="zm-cards-collected">';
        html += '<h4 class="zm-cards-title">已收集卡片</h4>';
        html += '<div class="zm-cards-grid" id="zmCardsGrid">';

        zmCollectedCards.forEach(function (combo) {
          // 检查是否是刚完成的组合
          var isNew = combo.length === newCombo.length && combo.every(function (v, i) { return v === newCombo[i]; });
          var cardClass = 'zm-card' + (isNew ? ' zm-card-new' : '');

          var emojiStr = combo.map(function (idx) { return SENSES[idx].emoji; }).join(' ');
          var nameStr = combo.map(function (idx) { return SENSES[idx].name; }).join('+');
          html += '<div class="' + cardClass + '">';
          html += '  <span class="zm-card-emoji">' + emojiStr + '</span>';
          html += '  <span class="zm-card-name">' + nameStr + '</span>';
          html += '</div>';
        });

        html += '</div>';
        html += '</div>';
        html += '<div class="zm-complete-actions">';
        html += '  <button class="zm-continue-btn" id="zmContinueBtn">继续练习</button>';
        html += '  <button class="zm-finish-btn" id="zmFinishBtn">返回选关</button>';
        html += '</div>';
        html += '</div>';

        questionsWrap.innerHTML = html;

        // 继续练习按钮
        document.getElementById('zmContinueBtn').addEventListener('click', function () {
          renderSenseSelect();
        });

        // 返回选关按钮
        document.getElementById('zmFinishBtn').addEventListener('click', function () {
          renderZenMapLevels();
        });
      }

      // ── 导航栏三点菜单 ─────────────────────
      (function () {
        var menuBtn = document.getElementById('navMenuBtn');
        var menuDropdown = document.getElementById('navDropdown');
        if (!menuBtn || !menuDropdown) return;

        menuBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          menuDropdown.classList.toggle('open');
        });

        document.addEventListener('click', function () {
          menuDropdown.classList.remove('open');
        });

        menuDropdown.addEventListener('click', function (e) {
          e.stopPropagation();
        });
      })();
    })();
  </script>

</body>
</html>
