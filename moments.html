<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>碎碎念 · 梁飞飞</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <style>
    .moments-page { padding: 0 0 60px; }
    .moments-header { text-align: center; margin-bottom: 32px; }
    .moments-title { font-size: 1.6rem; font-weight: 600; margin-bottom: 4px; }

    /* ── Tabs ──────────────────────────────── */
    .swipe-tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      box-shadow: var(--shadow);
    }

    .swipe-tab {
      padding: 8px 24px;
      border-radius: 99px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.22s, color 0.22s, box-shadow 0.22s;
    }

    .swipe-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(154, 181, 160, 0.35);
    }

    .swipe-tab:hover:not(.active) {
      color: var(--text);
    }

    /* ── Swipe container ───────────────────── */
    .swipe-wrap {
      position: relative;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    .swipe-track {
      display: flex;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .swipe-panel {
      flex: 0 0 100%;
      min-width: 0;
      width: 100%;
    }

    .swipe-panel-inner {
      padding: 0 0 20px;
    }

    /* ── Timeline ──────────────────────────── */
    .moments-timeline {
      position: relative;
      padding-left: 28px;
    }

    .moments-timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .moment-item {
      position: relative;
      padding-left: 28px;
      margin-bottom: 28px;
    }
    .moment-dot {
      position: absolute;
      left: 0;
      top: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--accent);
    }
    .moment-time {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .moment-text {
      line-height: 1.7;
      color: var(--text);
      margin: 0;
    }
    .moment-text-para { margin-bottom: 0.8em; }
    .moment-text-para:last-child { margin-bottom: 0; }

    .moment-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }

    .moment-thumb-wrap {
      margin-top: 12px;
    }
    .moment-thumb {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      cursor: zoom-in;
      transition: opacity 0.2s;
    }
    .moment-thumb:hover { opacity: 0.9; }

    .moment-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 1000;
    }
    .moment-lightbox.active { opacity: 1; visibility: visible; }
    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 4px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .lightbox-close:hover { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.5s ease forwards; opacity: 0; }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="header-nav">
        <a href="index.html" class="site-title">梁飞飞<span>·</span>写东西的地方</a>
        <a href="about.html" class="nav-about">关于我</a>
        <div class="nav-menu-wrap">
          <button class="nav-menu-btn" id="navMenuBtn" title="更多" aria-label="更多">···</button>
          <div class="nav-dropdown" id="navDropdown">
            <a href="games.html" class="nav-dropdown-item">✨ 小游戏</a>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggle" title="切换深色模式" aria-label="切换深色模式">🌙</button>
      </div>
      <p class="tagline">大巴黎 · 程序员 · 偶尔写写</p>
    </div>
  </header>

  <div class="divider"></div>

  <main class="container">
    <div class="moments-page">

      <a href="index.html" class="article-back">← 返回首页</a>

      <div class="moments-header">
        <h1 class="moments-title">碎碎念</h1>
      </div>

      <!-- 标签页 -->
      <div class="swipe-tabs" id="swipeTabs">
        <button class="swipe-tab" data-index="1">📝 生活</button>
        <button class="swipe-tab" data-index="0">💭 想法</button>
      </div>

      <!-- 滑动容器 -->
      <div class="swipe-wrap" id="swipeWrap">
        <div class="swipe-track" id="swipeTrack">

          <!-- 左：想法 -->
          <div class="swipe-panel">
            <div class="swipe-panel-inner">
              <div class="moments-timeline" id="thoughtsList">
                <p style="color:var(--muted); text-align:center; padding: 40px 0; font-size:0.88rem;">加载中…</p>
              </div>
            </div>
          </div>

          <!-- 右：生活记录（默认显示） -->
          <div class="swipe-panel">
            <div class="swipe-panel-inner">
              <div class="moments-timeline" id="lifeList">
                <p style="color:var(--muted); text-align:center; padding: 40px 0; font-size:0.88rem;">加载中…</p>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer>
    <div class="container">
      © 2026 梁飞飞 · 写得随意，读得开心
    </div>
  </footer>

  <!-- 图片弹窗 -->
  <div class="moment-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
  </div>

  <script>
    (function () {
      // ── 常量 ────────────────────────────────
      var SWIPE_THRESHOLD = 50; // px

      // ── 状态 ────────────────────────────────
      var currentPanel = 1; // 0=想法, 1=生活记录（默认）

      // ── DOM 引用 ────────────────────────────
      var trackEl = document.getElementById('swipeTrack');
      var tabs = document.querySelectorAll('.swipe-tab');
      var lightbox = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightboxImg');
      var lbClose = document.getElementById('lightboxClose');

      // ── 切换到指定面板 ──────────────────────
      function goToPanel(index) {
        if (index < 0 || index > 1) return;
        currentPanel = index;
        var offset = index * trackEl.parentElement.offsetWidth;
        trackEl.style.transform = 'translateX(-' + offset + 'px)';

        // 更新标签
        tabs.forEach(function (t, i) {
          var tabIdx = parseInt(t.dataset.index);
          t.classList.toggle('active', tabIdx === index);
        });
      }

      // ── Tab 点击 ───────────────────────────
      tabs.forEach(function (t) {
        t.addEventListener('click', function () {
          goToPanel(parseInt(t.dataset.index));
        });
      });

      // ── 触摸滑动 ───────────────────────────
      (function () {
        var startX = 0;
        var startY = 0;
        var isSwiping = false;
        var wrap = document.getElementById('swipeWrap');

        wrap.addEventListener('touchstart', function (e) {
          var t = e.touches[0];
          startX = t.clientX;
          startY = t.clientY;
          isSwiping = false;
        }, { passive: true });

        wrap.addEventListener('touchmove', function (e) {
          if (!isSwiping) {
            var t = e.touches[0];
            var dx = t.clientX - startX;
            var dy = t.clientY - startY;
            // 只在水平滑动时启用
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
              isSwiping = true;
            }
          }
        }, { passive: true });

        wrap.addEventListener('touchend', function (e) {
          if (!isSwiping) return;
          var t = e.changedTouches[0];
          var dx = t.clientX - startX;

          if (dx > SWIPE_THRESHOLD) {
            // 右滑 → 碎碎念（想法，index 0）
            goToPanel(0);
          } else if (dx < -SWIPE_THRESHOLD) {
            // 左滑 → 生活记录（index 1）
            goToPanel(1);
          }
          isSwiping = false;
        }, { passive: true });
      })();

      // ── 重绘时重新校正位置（横竖屏切换） ────
      window.addEventListener('resize', function () {
        goToPanel(currentPanel);
      });
      function openLightbox(src, alt) {
        lbImg.src = src;
        lbImg.alt = alt || '';
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        lbImg.src = '';
      }

      lbClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
      });

      // ── 渲染时间线 ─────────────────────────
      function render(container, items) {
        if (!items || items.length === 0) {
          container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px 0;font-size:0.88rem;">还没有内容。</p>';
          return;
        }

        container.innerHTML = items.map(function (item, i) {
          var imgHtml = item.image
            ? '<div class="moment-thumb-wrap"><img class="moment-thumb" src="' + item.image + '" alt="配图" loading="lazy" data-src="' + item.image + '"></div>'
            : '';
          return (
            '<div class="moment-item fade-up" style="animation-delay:' + (i * 0.06) + 's">' +
              '<div class="moment-dot"></div>' +
              '<div class="moment-content">' +
                '<time class="moment-time">' + item.date + '</time>' +
                textToParas(item.text) +
                imgHtml +
              '</div>' +
            '</div>'
          );
        }).join('');

        container.querySelectorAll('.moment-thumb').forEach(function (img) {
          img.addEventListener('click', function () {
            openLightbox(img.dataset.src, img.alt);
          });
        });
      }

      function textToParas(str) {
        var escaped = str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        var paras = escaped.split(/\n+/).filter(function (p) {
          return p.trim().length > 0;
        });
        if (paras.length === 0) return '';
        if (paras.length === 1) return '<p class="moment-text">' + paras[0] + '</p>';
        return paras.map(function (p) {
          return '<p class="moment-text moment-text-para">' + p + '</p>';
        }).join('');
      }

      // ── 加载时间线数据 ─────────────────────
      function loadTimeline(containerId, indexUrl) {
        var container = document.getElementById(containerId);
        var ts = '?t=' + Date.now();

        fetch(indexUrl + ts)
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (files) {
            if (!files || files.length === 0) { render(container, []); return; }
            return Promise.all(files.map(function (f) {
              return fetch(indexUrl.replace('index.json', '') + f + ts)
                .then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; });
            }));
          })
          .then(function (items) {
            render(container, (items || []).filter(Boolean));
          })
          .catch(function () {
            container.innerHTML = '<p style="color:#e55;text-align:center;padding:40px 0;">加载失败。</p>';
          });
      }

      // 加载两条时间线
      loadTimeline('thoughtsList', 'moments/index.json');
      loadTimeline('lifeList', 'life/index.json');

      // ── 默认显示生活记录 ───────────────────
      goToPanel(1);

      // ── 深色模式 ───────────────────────────
      (function () {
        var btn = document.getElementById('themeToggle');
        if (!btn) return;
        if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark');
          btn.textContent = '☀️';
        }
        btn.addEventListener('click', function () {
          var isDark = document.body.classList.toggle('dark');
          btn.textContent = isDark ? '☀️' : '🌙';
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
      })();

      // ── 导航栏三点菜单 ─────────────────────
      (function () {
        var menuBtn = document.getElementById('navMenuBtn');
        var menuDropdown = document.getElementById('navDropdown');
        if (!menuBtn || !menuDropdown) return;

        menuBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          e.preventDefault();
          menuDropdown.classList.toggle('open');
        });

        document.addEventListener('click', function () {
          menuDropdown.classList.remove('open');
        });

        menuDropdown.addEventListener('click', function (e) {
          e.stopPropagation();
        });
      })();
    })();
  </script>

</body>
</html>
